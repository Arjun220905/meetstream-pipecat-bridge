[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "meetstream-pipecat"
version = "0.2.0"
description = "Run a Pipecat voice pipeline in a MeetStream meeting bot"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "pipecat-ai[deepgram,google,silero]==1.14.0",
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.38,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[project.urls]
Repository = "https://github.com/Arjun220905/meetstream-pipecat-bridge"
Documentation = "https://github.com/Arjun220905/meetstream-pipecat-bridge/blob/main/quickstart.md"
Issues = "https://github.com/Arjun220905/meetstream-pipecat-bridge/issues"

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "build>=1,<2"]

[dependency-groups]
launcher = ["python-dotenv>=1,<2"]

[project.scripts]
meetstream-pipecat = "meetstream_pipecat.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meetstream_pipecat"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
